server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: course-service
  config:
    # "optional:" = the service still starts if the Config Server is briefly unavailable
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      # never hang on startup because of an unreachable config server
      request-connect-timeout: 5000
      request-read-timeout: 10000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learnhub_course_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    # Comma separated list - both Eureka nodes on GCP
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 60

management:
  health:
    config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
